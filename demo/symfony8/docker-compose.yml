# Single service "php" (FrankenPHP); no separate nginx (§2.4, pattern TwigInspector)
name: password-toggle-bundle-demo-symfony-8
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: password-toggle-demo-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8003}:80"
    volumes:
      - .:/app
      - ../..:/var/password-toggle-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - password-toggle-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  password-toggle-demo-network:
    driver: bridge
