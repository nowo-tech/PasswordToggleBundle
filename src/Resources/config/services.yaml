services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\PasswordToggleBundle\IconSupport\:
    resource: '../../IconSupport/*'

  Nowo\PasswordToggleBundle\EventSubscriber\:
    resource: '../../EventSubscriber/*'

  Nowo\PasswordToggleBundle\Form\Type\PasswordType:
    arguments:
      $defaults: '%nowo_password_toggle.defaults%'

  Nowo\PasswordToggleBundle\Form\Type\:
    resource: '../../Form/Type/*'
    exclude: '../../Form/Type/PasswordType.php'
